name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            git config --global --add safe.directory /home/dwsa/public_html/website
            cd /home/dwsa/public_html/website
            git stash
            GIT_SSH_COMMAND="ssh -i /home/developers/.ssh/id_ed25519" git pull origin main
            php /usr/local/bin/composer install --no-dev --optimize-autoloader --ignore-platform-req=php
            php artisan optimize:clear
            php artisan migrate --force
            php artisan filament:upgrade
            php artisan config:cache
            php artisan route:cache
            php artisan view:clear
            php artisan storage:link
            PHP_BIN="$(command -v php || true)"
            if [ -n "$PHP_BIN" ]; then "$PHP_BIN" -r "if (function_exists('opcache_reset')) { opcache_reset(); }" || true; fi
            FPM_SERVICE="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -E '(^|-)php([0-9.-]+)?-fpm\\.service$|^php-fpm\\.service$|^ea-php[0-9]+-php-fpm\\.service$' | head -n 1)"
            if [ -n "$FPM_SERVICE" ]; then
              systemctl reload "$FPM_SERVICE" || true
            elif systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -q '^httpd\\.service$'; then
              systemctl reload httpd || true
            elif systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -q '^apache2\\.service$'; then
              systemctl reload apache2 || true
            fi
            chown -R dwsa:dwsa /home/dwsa/public_html/website
            chmod 711 /home/dwsa
            chmod 755 /home/dwsa/public_html
            chmod -R 755 /home/dwsa/public_html/website
            chmod 644 /home/dwsa/public_html/website/.htaccess
            chmod -R 775 /home/dwsa/public_html/website/storage
            chmod -R 775 /home/dwsa/public_html/website/bootstrap/cache
